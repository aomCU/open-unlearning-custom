TOFU_QA_forget_idk:
  handler: QAwithIdkDataset
  args:
    hf_args:
      path: json
      data_files: ${oc.env:DATASET_ROOT}/TOFU/forget10.json
      split: train
    question_key: "question"
    answer_key: "answer"
    max_length: 512
    idk_path: ./data/idk.jsonl
    return_original: true
    