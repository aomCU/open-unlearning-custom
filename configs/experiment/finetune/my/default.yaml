# @package _global_

defaults:
  - override /model: Llama-3.1-8B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: my_all_full
  - override /eval: my

mode: finetune
trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.0 
    num_train_epochs: 5
    lr_scheduler_type: linear

forget_split: my_forget
retain_split: my_retain

eval:
  my:
    forget_split: ${forget_split}
    retain_split: ${holdout_split}

task_name: ???