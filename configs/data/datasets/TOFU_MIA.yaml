TOFU_QA_forget:
  access_key: forget
  handler: QADataset
  args:
    hf_args:
      path: json
      data_files: ${oc.env:DATASET_ROOT}/TOFU/forget10.json
      split: train
    question_key: "question"
    answer_key: "answer"
    max_length: 512
TOFU_QA_holdout:
  access_key: holdout
  handler: QADataset
  args:
    hf_args:
      path: json
      data_files: ${oc.env:DATASET_ROOT}/TOFU/holdout10.json
      split: train
    question_key: "question"
    answer_key: "answer"
    max_length: 512